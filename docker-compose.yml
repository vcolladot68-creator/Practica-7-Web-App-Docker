
services:
  web:
    build: .
    container_name: aplicacion-web
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root12345
      DB_NAME: basedatos_practica
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: servidor-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root12345
      MYSQL_DATABASE: basedatos_practica
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot12345"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
